# WHO you are and WHAT you want. Everything here is fed to the model on every
# judgement. This file is created from preferences.example.yaml on first start
# and is yours: it is git-ignored. Edit it in the web app (settings -> Your
# preferences) rather than by hand -- the form always writes a valid file.
#
# Free text about what you want lives in profile/notes.md, not here.

# Where you live. Drives the eligibility judgement together with citizenship.
based_in: ""

# Passports / right-to-work, e.g. ["Germany", "EU"] or ["US"].
citizenship: []

# One or two sentences on what you can legally take and from where: visas,
# contractor vs employee, whether you would relocate.
work_authorization_notes: ""

# The roles you are after, as they appear in postings.
titles: []

# Any of: junior, mid, senior, staff, principal, lead.
seniority: []

# Markets in the order to search them. The first wins ties; later ones still
# surface. remote: required | any | no.
location_rules: []
market_priority: []

languages: []

# Skills a posting should ask for.
must_have: []
nice_to_have: []

# Anything here caps a posting's score at 20. Plain words.
dealbreakers: []

# Your floor, or null to ignore salary.
#   min_salary: {amount: 60000, currency: EUR, period: year}
min_salary: null
